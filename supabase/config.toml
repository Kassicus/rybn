# Supabase CLI configuration for rybn.
#
# The Clerk instance is registered below. Both required changes are done:
# the real Frontend API domain is set, and the block is enabled.
#
# Historical note, kept because it will bite whoever edits this next: the CLI
# validates `domain` whenever this block is enabled, and rejects a placeholder
# outright --
#
#   Invalid config: auth.third_party.clerk has invalid domain, it usually is
#   like clerk.example.com or example.clerk.accounts.dev
#
# -- which makes EVERY CLI command fail, including `db reset --linked` and the
# RLS test harness. So never leave this enabled with a placeholder domain, and
# never substitute a syntactically valid but wrong one: that survives
# validation and would quietly register a bogus issuer on `config push`.
#
# The database side of the Clerk migration does not depend on this file:
# policies read the JWT `sub` claim through public.requesting_user_id(). This
# block is what tells the Supabase platform which issuer to trust.

project_id = "xomvbdvvrlbxoyqdsstt"

[auth.third_party.clerk]
enabled = true
domain = "clerk.rybn.app"
